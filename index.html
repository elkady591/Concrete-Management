<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Concrete Management</title>
<!-- Bumped on every change; the page compares it with the live copy and updates itself (see checkForUpdate) -->
<meta name="app-build" content="20261017-000001">
<meta name="theme-color" content="#0d1120">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png?v=3" sizes="32x32">
<link rel="icon" href="icons/icon-192.png?v=3" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Concrete Mgmt">
<style>
  :root{
    --bg:#0d1120; --panel:#161c2e; --panel2:#1b2338; --side:#111627;
    --ink:#eef1fb; --muted:#98a2c0; --faint:#6a7391;
    --line:rgba(255,255,255,.09); --accent:#7c83ff; --cyan:#22d3ee;
    --sans:'Inter','Segoe UI',system-ui,sans-serif;
    --sideW:228px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{color:var(--ink);font-family:var(--sans);font-size:15px;background:var(--bg);
    -webkit-font-smoothing:antialiased;display:flex;overflow:hidden}

  /* ---- side navigation: always visible, so you move between tools without leaving ---- */
  .side{width:var(--sideW);flex:none;display:flex;flex-direction:column;gap:4px;padding:16px 10px;
    background:var(--side);border-right:1px solid var(--line)}
  .brand{padding:4px 10px 14px;font-weight:800;font-size:13.5px;letter-spacing:.2px;line-height:1.3}
  .brand small{display:block;color:var(--faint);font-weight:500;font-size:11px;margin-top:2px}
  .nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid transparent;
    color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;cursor:pointer;
    transition:background .15s ease,color .15s ease}
  .nav span{white-space:nowrap}
  .nav .nm-short{display:none}
  .nav .ic{font-size:18px;line-height:1;width:26px;text-align:center;flex:none}
  .nav img.ic{height:26px;border-radius:6px;display:block;background:#fff}
  .nav:hover{background:rgba(255,255,255,.05);color:var(--ink)}
  .nav.active{background:rgba(124,131,255,.16);border-color:rgba(124,131,255,.4);color:var(--ink)}
  .nav.soon{opacity:.45;cursor:default}
  .nav.soon:hover{background:none;color:var(--muted)}
  .nav .soon-tag{margin-left:auto;font-size:9.5px;font-weight:700;color:var(--faint);
    border:1px solid var(--line);border-radius:999px;padding:1px 6px}

  /* ---- content ---- */
  .main{flex:1;min-width:0;position:relative}
  .pane{position:absolute;inset:0;display:none}
  .pane.show{display:block}
  .pane iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
  .desk{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .desk img.ic{width:96px;height:96px;border-radius:22px;background:#fff}
  .desk h2{margin:18px 0 6px;font-size:22px;font-weight:800}
  .desk p{margin:0;color:var(--muted);font-size:13.5px}
  .desk .run{margin:22px 0 14px;padding:12px 26px;border-radius:14px;background:var(--accent);color:#fff;
    font-weight:800;font-size:15px;text-decoration:none}
  .desk .note{font-size:12px;color:var(--faint);max-width:340px;line-height:1.6}
  #home{overflow:auto}
  #home::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(50% 45% at 12% 6%,rgba(124,131,255,.22),transparent 60%),
      radial-gradient(46% 42% at 90% 4%,rgba(34,211,238,.16),transparent 60%)}
  .wrap{max-width:980px;margin:0 auto;padding:36px 20px 60px}
  h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  /* today's numbers on top of Home */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
  .kpi{display:block;text-decoration:none;color:inherit;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  a.kpi:hover{border-color:rgba(124,131,255,.55)}
  .kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
  .kpi .v{font-family:'JetBrains Mono',Consolas,monospace;font-size:26px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .v small{font-size:12px;color:var(--faint);margin-left:3px;font-weight:600}
  .kpi .s{font-size:11px;color:var(--faint);margin-top:3px}
  /* a loaded truck flagged "Action Needed" in the sheet: the Trucks tile glows red */
  @keyframes warnGlow{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0)}50%{box-shadow:0 0 18px 2px rgba(248,113,113,.5)}}
  .kpi.warn{border-color:rgba(248,113,113,.8);animation:warnGlow 1.6s ease-in-out infinite}
  .kpi.warn .v .ld{color:#f87171}
  .kpi.warn .s{color:#f87171;font-weight:700}
  /* the tools, in two groups: online (any device) and programs that run on the office PC */
  .grp{margin-top:24px}
  .grp h2{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:0 0 10px}
  .apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .app{display:block;text-align:center;padding:16px 10px;border-radius:16px;border:1px solid var(--line);text-decoration:none;color:inherit;
    background:linear-gradient(180deg,var(--panel),var(--panel2));transition:transform .15s ease,border-color .15s ease}
  a.app:hover{transform:translateY(-3px);border-color:rgba(124,131,255,.55)}
  .app img.ic{width:64px;height:64px;border-radius:15px;background:#fff;display:block;margin:0 auto}
  .app .nm{font-weight:700;font-size:13px;margin-top:10px}
  .app .ds{color:var(--faint);font-size:11px;margin-top:3px;line-height:1.4}

  /* ---- phone: the side nav becomes a bottom bar ---- */
  @media (max-width:760px){
    body{flex-direction:column-reverse}
    .side{width:100%;flex-direction:row;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
      border-right:0;border-top:1px solid var(--line);overflow-x:auto}
    .brand{display:none}
    /* six equal slots; each shows the tool's short name so the labels never run into each other */
    .nav{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;padding:7px 2px;font-size:10.5px;text-align:center}
    .nav .nm-full{display:none}
    .nav .nm-short{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
    .nav .soon-tag{display:none}
    .wrap{padding:24px 16px 40px}
    .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
    .kpi{padding:11px 12px} .kpi .v{font-size:21px}
    .apps{grid-template-columns:repeat(3,1fr);gap:8px}
    .app{padding:12px 4px} .app img.ic{width:52px;height:52px;border-radius:13px}
    .app .ds{display:none} .app .nm{font-size:11.5px}
  }
</style>
</head>
<body>

<nav class="side" id="side">
  <div class="brand"><img src="icons/icon-192.png" alt="" width="38" height="38" style="display:block;margin-bottom:10px">CONCRETE MANAGEMENT<small>All concrete tools in one place</small></div>
</nav>

<div class="main" id="main">
  <div class="pane" id="home">
    <div class="wrap">
      <h1>CONCRETE MANAGEMENT</h1>
      <div class="sub">All concrete tools in one place</div>
      <div class="kpis" id="kpis"></div>
      <div id="apps"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* One entry per tool. `src` = the tool's own page (loaded inside the shell); no `src` = not added yet.
   Ice and Mixes are NOT copied here: they load from their own repos on the same site, so there is one
   copy of each to maintain and their saved data is the same whether opened here or on their own. */
const SITE='https://elkady591.github.io/';
const TOOLS=[
  {id:'dispatching',  name:'Concrete Dispatching', short:'Dispatch', img:SITE+'Concrete-Dispatching/icons/icon-192.png', desc:'Real-time concrete pour monitoring', src:SITE+'Concrete-Dispatching/'},
  {id:'pouring',      name:'Pouring Report', short:'Pouring', img:SITE+'Pouring-Report/icon-192.png', desc:'Hourly pour rate report from the truck messages', src:SITE+'Pouring-Report/'},
  {id:'ice',          name:'Ice Calculation', short:'Ice', img:SITE+'Ice-Calculator/icon-192.png', desc:'Ice blocks to order for a pour',         src:SITE+'Ice-Calculator/'},
  {id:'mixes',        name:'NCM Mixes', short:'Mixes', img:SITE+'NCM-Mixes/icon-192.png',      desc:'Mix designs catalog and materials',     src:SITE+'NCM-Mixes/'},
  // Desktop programs (.exe on the office PC), not web pages: `launch` is a URL protocol registered on that PC
  // by register-desktop-tools.reg — the page can only ask Windows to start them.
  {id:'pumps',        name:'Pumps Movements', short:'Pumps', img:'icons/pumps.png',    desc:'Pump movements sheet from the WhatsApp export', launch:'ncm-pumps://open'},
  {id:'rejected',     name:'Rejected Concrete', short:'Rejected', img:'icons/rejected.png', desc:'Rejected concrete sheet from the WhatsApp export', launch:'ncm-rejected://open'}
];
const ON_WINDOWS=/Windows NT/.test(navigator.userAgent);
const pic=(t,cls)=>t.img?`<img class="${cls}" src="${t.img}" alt="">`:`<span class="${cls}">${t.icon||''}</span>`;
const side=document.getElementById('side'), main=document.getElementById('main'), apps=document.getElementById('apps');

function navItem(t,soon){
  const a=document.createElement(soon?'div':'a');
  a.className='nav'+(soon?' soon':''); a.dataset.id=t.id;
  if(!soon) a.href='#'+t.id;
  a.innerHTML=`${pic(t,'ic')}<span class="nm-full">${t.name}</span><span class="nm-short">${t.short||t.name}</span>${soon?'<span class="soon-tag">soon</span>':''}`;
  side.appendChild(a);
}
navItem({id:'home',name:'Home',icon:'🏠'},false);
for(const t of TOOLS) navItem(t,!(t.src||t.launch));
const tile=t=>`<a class="app" href="#${t.id}" data-id="${t.id}">${pic(t,'ic')}<div class="nm">${t.name}</div><div class="ds">${t.desc}</div></a>`;
const group=(title,list)=>list.length?`<div class="grp"><h2>${title}</h2><div class="apps">${list.map(tile).join('')}</div></div>`:'';
apps.innerHTML=group('Online — any device',TOOLS.filter(t=>t.src))+group('Office PC programs',TOOLS.filter(t=>t.launch));

/* Each tool's frame is created the first time it is opened and then kept alive,
   so switching back and forth never reloads it or loses where you were. */
function makePane(t){
  let p=document.getElementById('pane-'+t.id);
  if(!p){
    p=document.createElement('div'); p.className='pane'; p.id='pane-'+t.id;
    p.innerHTML = t.src ? `<iframe src="${freshSrc(t)}" title="${t.name}" allow="web-share; clipboard-write"></iframe>`
      : `<div class="desk">${pic(t,'ic')}<h2>${t.name}</h2><p>${t.desc}</p>
           ${ON_WINDOWS ? `<a class="run" href="${t.launch}">▶ Run program</a>
             <p class="note">Runs on the office PC. If nothing opens, the program is not set up on this computer.</p>`
           : `<p class="note">This is a desktop program — it runs on the office PC only.</p>`}</div>`;
    main.appendChild(p);
    // note which version of the tool this frame is running (again after any reload, incl. its own self-update)
    const fr=p.querySelector('iframe'); if(fr) fr.addEventListener('load',()=>remember(t));
  }
  return p;
}
function show(id){
  const t=TOOLS.find(x=>x.id===id&&(x.src||x.launch));
  if(!t) id='home';
  if(t) makePane(t);
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('show', p.id===(t?'pane-'+id:'home')));
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active', n.dataset.id===id));
  document.title = t ? (t.name+' · Concrete Management') : 'Concrete Management';
}
const OLD_IDS={'pour-tracker':'dispatching'};   // links saved before the rename still land on the right tool
const route=()=>{ const h=location.hash.slice(1)||'home'; show(OLD_IDS[h]||h); };
window.addEventListener('hashchange',route);

/* ---------- self-update: Concrete Management AND every tool inside it ----------
   A window left open (or a stale cached copy) would keep running old code.
   - Concrete Management itself: on open, if the live copy is newer, reload straight away; later, reload by
     itself only while on Home, where nothing can be lost.
   - The tools (Dispatching, Pouring, Ice, Mixes…): each frame remembers the version it loaded; when its repo
     gets a new version, the same "Update available" button appears in the menu. Clicking it reloads only the
     tools that changed (or everything, when Concrete Management itself changed).
   A tool's version = its <meta name="app-build"> when it has one, otherwise a fingerprint of its page. */
const APP_BUILD=(document.querySelector('meta[name="app-build"]')||{}).content||'';
const SIG={};                 // tool id -> version its frame is running
let HUB_NEW=null, STALE=[];   // newer Concrete Management build / tools with a newer version
const hashStr=s=>{ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return h; };
async function liveVersion(url){
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'cb='+Date.now(),{cache:'no-store'}); if(!r.ok) return null;
    const t=await r.text(); const m=t.match(/name="app-build"\s+content="([^"]*)"/i);
    return m ? m[1] : 'h'+hashStr(t);
  }catch(e){ return null; }
}
function freshSrc(t){ return t.src+(t.src.includes('?')?'&':'?')+'v='+Date.now(); }   // never a stale cached copy
async function remember(t){ const v=await liveVersion(t.src); if(v) SIG[t.id]=v; }
function updateNow(){
  if(HUB_NEW){
    sessionStorage.setItem('cm_upd',HUB_NEW);
    location.replace(location.href.split('#')[0].split('?')[0]+'?v='+encodeURIComponent(HUB_NEW)+location.hash); return;
  }
  for(const id of STALE){
    const t=TOOLS.find(x=>x.id===id), fr=document.querySelector('#pane-'+id+' iframe');
    if(t&&fr){ delete SIG[id]; fr.src=freshSrc(t); }
  }
  STALE=[]; const b=document.getElementById('updBtn'); if(b) b.remove();
}
function showUpdBtn(){
  if(document.getElementById('updBtn')) return;
  const b=document.createElement('a'); b.id='updBtn'; b.className='nav'; b.style.color='var(--cyan)';
  b.innerHTML='<span class="ic">🔄</span><span class="nm-full">Update available</span><span class="nm-short">Update</span>';
  b.addEventListener('click',updateNow); side.appendChild(b);
}
async function checkForUpdate(atOpen){
  try{
    const live=await liveVersion(location.href.split('#')[0].split('?')[0]);
    if(live && APP_BUILD && live!==APP_BUILD && sessionStorage.getItem('cm_upd')!==live){   // never loop on one build
      HUB_NEW=live;
      const onHome=!document.querySelector('.pane.show:not(#home)');
      if(atOpen||onHome){ updateNow(); return; }
    }
    STALE=[];
    for(const t of TOOLS){
      if(!t.src||!SIG[t.id]) continue;          // frame not opened yet: it will load the newest copy anyway
      const v=await liveVersion(t.src);
      if(v && v!==SIG[t.id]) STALE.push(t.id);
    }
    if(HUB_NEW||STALE.length) showUpdBtn();
  }catch(e){}
}
checkForUpdate(true); setInterval(()=>checkForUpdate(false),180000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkForUpdate(false); });
route();

/* ---------- today's numbers on Home ----------
   Production and trucks come straight from the trucks sheet's "Trucks Tracking" tab (its own
   "Today ( 8 AM : 8 AM )" / "Yesterday ( 8 AM : 8 AM )" TOTAL cells, "Loaded Trucks", "Working Trucks Today").
   Active pours is worked out by Concrete Dispatching (plan + trucks + Done marks), so its page is started in
   the background as soon as this opens and the count is read from it — it shows up a few seconds after opening. */
const TRUCKS_CSV='https://docs.google.com/spreadsheets/d/1oZfnrFmYL46zKtTH8htHyLjLYf5udq5hL-TcVdGwrIE/export?format=csv&gid=1257690697';
const KPI={};
const kfmt=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
function drawKpis(){
  document.getElementById('kpis').innerHTML=`
    <a class="kpi" href="#dispatching" data-go="production"><div class="l">Production today</div><div class="v">${kfmt(KPI.t8)}<small>m³</small></div><div class="s">8 AM : 8 AM</div></a>
    <a class="kpi" href="#dispatching" data-go="production"><div class="l">Yesterday</div><div class="v">${kfmt(KPI.y8)}<small>m³</small></div><div class="s">8 AM : 8 AM</div></a>
    <a class="kpi" href="#dispatching" data-go="pours"><div class="l">Active pours</div><div class="v" style="color:var(--cyan)">${KPI.active==null?'—':KPI.active}</div><div class="s">running now</div></a>
    <a class="kpi${KPI.needed>0?' warn':''}" href="#dispatching" data-go="trucks" data-sub="loaded"><div class="l">Trucks out now</div><div class="v"><span class="ld">${kfmt(KPI.loaded)}</span><small>/ ${kfmt(KPI.working)}</small></div><div class="s">${KPI.needed>0?`⚠ ${KPI.needed} action needed`:'loaded / working'}</div></a>`;
}
// A tile opens Concrete Dispatching on the matching page (Production / All Pours / Trucks → Loaded).
// The page may still be loading in the background, so keep asking it for up to ~15 s.
document.getElementById('kpis').addEventListener('click',e=>{
  const k=e.target.closest('a.kpi[data-go]'); if(!k) return;
  const go=k.dataset.go, sub=k.dataset.sub||null; let tries=0;
  (function jump(){
    try{ const w=document.querySelector('#pane-dispatching iframe').contentWindow;
      if(typeof w.openView==='function' && typeof w.saveCfg==='function'){ w.openView(go,sub); return; } }catch(err){}
    if(++tries<50) setTimeout(jump,300);
  })();
});
function csvLine(line){ const o=[]; let c='', q=false; for(const ch of line){ if(ch==='"') q=!q; else if(ch===','&&!q){ o.push(c); c=''; } else c+=ch; } o.push(c); return o; }
async function loadKpis(){
  try{
    const r=await fetch(TRUCKS_CSV+'&_='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const rows=(await r.text()).split(/\r?\n/).map(csvLine);
    const v=s=>{ const x=String(s==null?'':s).replace(/[^0-9.]/g,''); return x===''?null:parseFloat(x); };
    const block=re=>{                                     // the TOTAL under a "Today/Yesterday ( 8 AM : 8 AM )" title
      for(let i=0;i<rows.length;i++) for(let j=0;j<rows[i].length;j++) if(re.test(rows[i][j]||'')){
        for(let k=i+1;k<Math.min(rows.length,i+12);k++) if(/^\s*total\s*$/i.test(rows[k][j]||'')) return v(rows[k][j+1]);
        return null; }
      return undefined; };
    const t8=block(/^\s*today\s*\(\s*8\s*AM/i), y8=block(/^\s*yesterday\s*\(\s*8\s*AM/i);
    if(t8!==undefined) KPI.t8=t8; if(y8!==undefined) KPI.y8=y8;
    // loaded trucks still out: the list under "Truck Mixer | … | Departure | … | Action", until the first blank truck
    const hr=rows.findIndex(r=>r.some(x=>/truck\s*mixer/i.test(x))&&r.some(x=>/departure/i.test(x)));
    if(hr>=0){
      const cT=rows[hr].findIndex(x=>/truck\s*mixer/i.test(x)), cA=rows[hr].findIndex(x=>/^\s*action\s*$/i.test(x));
      let n=0;
      for(let i=hr+1;i<rows.length;i++){ if(!String(rows[i][cT]||'').trim()) break; if(cA>=0&&/action\s*needed/i.test(rows[i][cA]||'')) n++; }
      KPI.needed=n;
    }
    for(const row of rows) for(let j=0;j<row.length;j++){
      if(/^\s*loaded trucks\s*$/i.test(row[j]||'')) KPI.loaded=v(row.slice(j+1).find(x=>String(x).trim()));
      if(/^\s*working trucks today\s*$/i.test(row[j]||'')) KPI.working=v(row.slice(j+1).find(x=>String(x).trim()));
    }
  }catch(e){}
  drawKpis();
}
function readActive(){
  try{
    const fr=document.querySelector('#pane-dispatching iframe');
    const n=fr&&fr.contentWindow.eval('(typeof LAST!=="undefined"&&LAST.matrix&&LAST.matrix.length)?VD.open.length:null');
    if(typeof n==='number' && n!==KPI.active){ KPI.active=n; drawKpis(); }
  }catch(e){}                                             // not loaded yet, or opened from another address
}
drawKpis(); loadKpis(); setInterval(loadKpis,60000);
makePane(TOOLS.find(t=>t.id==='dispatching'));           // start Concrete Dispatching in the background
setInterval(readActive,3000);
</script>
</body>
</html>
